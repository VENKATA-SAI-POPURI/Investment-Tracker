<div class="app-container">
  <!-- Top Ribbon -->
  <header class="top-ribbon">
    <div class="ribbon-left">
      <div class="ribbon-brand">
        <span class="ribbon-brand-icon">🪙</span>
        <div class="ribbon-brand-text">
          <span class="ribbon-brand-name">Investment Tracker</span>
          <span class="ribbon-brand-sub">Portfolio Dashboard</span>
        </div>
      </div>
    </div>
    <div class="ribbon-center">
      <ng-container *ngIf="currentPage !== 'home'">
        <span class="ribbon-page-icon">{{ pageIcon }}</span>
        <h1 class="page-title">{{ pageLabel }}</h1>
      </ng-container>
    </div>
    <div class="ribbon-actions">
      <div class="ribbon-user" *ngIf="currentUser">
        <img *ngIf="currentUser.picture" [src]="currentUser.picture" class="ribbon-avatar" referrerpolicy="no-referrer" alt="avatar">
        <span class="ribbon-username">{{ currentUser.name || currentUser.email }}</span>
      </div>
      <button class="ribbon-icon-btn" (click)="toggleDarkMode()" [title]="darkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
        {{ darkMode ? '☀️' : '🌙' }}
      </button>
      <button class="ribbon-icon-btn ribbon-logout-btn" (click)="logout()" title="Logout">🚪</button>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="app-layout">
    <!-- Left Sidebar -->
    <aside class="sidebar" [class.collapsed]="sidebarCollapsed">
    <nav class="sidebar-nav">

      <!-- Toggle button -->
      <button class="sidebar-toggle" (click)="toggleSidebar()" [title]="sidebarCollapsed ? 'Expand menu' : 'Collapse menu'">
        <span class="nav-icon">{{ sidebarCollapsed ? '▶' : '◀' }}</span>
        <span class="nav-label">Collapse</span>
      </button>

      <button
        class="nav-btn"
        [class.active]="isActive('home')"
        (click)="navigateTo('home')"
        [title]="sidebarCollapsed ? 'Home' : ''">
        <span class="nav-icon">🏠</span><span class="nav-label"> Home</span>
      </button>

      <div class="nav-row">
        <button
          class="nav-btn"
          [class.active]="isActive('equity')"
          (click)="navigateTo('equity')"
          [title]="sidebarCollapsed ? 'Equity' : ''">
          <span class="nav-icon">📈</span><span class="nav-label"> Equity</span>
        </button>
        <button *ngIf="isActive('equity')" class="nav-plus-btn" (click)="triggerAddEntry()" title="Add Equity Entry">+</button>
      </div>

      <div class="nav-row">
        <button
          class="nav-btn"
          [class.active]="isActive('mutual-funds')"
          (click)="navigateTo('mutual-funds')"
          [title]="sidebarCollapsed ? 'Mutual Funds' : ''">
          <span class="nav-icon">💼</span><span class="nav-label"> Mutual Funds</span>
        </button>
        <button *ngIf="isActive('mutual-funds')" class="nav-plus-btn" (click)="triggerAddEntry()" title="Add Mutual Fund Entry">+</button>
      </div>

      <div class="nav-row">
        <button
          class="nav-btn"
          [class.active]="isActive('commodity')"
          (click)="navigateTo('commodity')"
          [title]="sidebarCollapsed ? 'Commodity' : ''">
          <span class="nav-icon">⛏️</span><span class="nav-label"> Commodity</span>
        </button>
        <button *ngIf="isActive('commodity')" class="nav-plus-btn" (click)="triggerAddEntry()" title="Add Commodity Entry">+</button>
      </div>

      <div class="nav-row">
        <button
          class="nav-btn"
          [class.active]="isActive('p2p')"
          (click)="navigateTo('p2p')"
          [title]="sidebarCollapsed ? 'P2P' : ''">
          <span class="nav-icon">👥</span><span class="nav-label"> P2P</span>
        </button>
        <button *ngIf="isActive('p2p')" class="nav-plus-btn" (click)="triggerAddEntry()" title="Add P2P Entry">+</button>
      </div>

      <div class="nav-row">
        <button
          class="nav-btn"
          [class.active]="isActive('fixed-deposits')"
          (click)="navigateTo('fixed-deposits')"
          [title]="sidebarCollapsed ? 'Fixed Deposits' : ''">
          <span class="nav-icon">🏦</span><span class="nav-label"> Fixed Deposits</span>
        </button>
        <button *ngIf="isActive('fixed-deposits')" class="nav-plus-btn" (click)="triggerAddEntry()" title="Add Fixed Deposit">+</button>
      </div>

      <div class="nav-row">
        <button
          class="nav-btn"
          [class.active]="isActive('forex')"
          (click)="navigateTo('forex')"
          [title]="sidebarCollapsed ? 'Forex' : ''">
          <span class="nav-icon">💱</span><span class="nav-label"> Forex</span>
        </button>
        <button *ngIf="isActive('forex')" class="nav-plus-btn" (click)="triggerAddEntry()" title="Add Forex Entry">+</button>
      </div>

      <hr class="divider">

      <button
        class="nav-btn"
        [class.active]="isActive('investment-analysis')"
        (click)="navigateTo('investment-analysis')"
        [title]="sidebarCollapsed ? 'Investment Analysis' : ''">
        <span class="nav-icon">📊</span><span class="nav-label"> Investment Analysis</span>
      </button>

      <hr class="divider">

      <button class="nav-btn refresh-btn" (click)="refreshData()" [disabled]="isRefreshing" [title]="sidebarCollapsed ? (isRefreshing ? 'Refreshing…' : 'Refresh') : ''">
        <span class="nav-icon">{{ isRefreshing ? '⏳' : '🔄' }}</span><span class="nav-label"> {{ isRefreshing ? 'Refreshing...' : 'Refresh' }}</span>
      </button>

      <button class="nav-btn" (click)="fetchAllLivePrices()" [disabled]="isFetchingAllPrices" [title]="livePriceTooltip">
        <span class="nav-icon">{{ isFetchingAllPrices ? '⏳' : '📡' }}</span><span class="nav-label"> {{ isFetchingAllPrices ? 'Fetching...' : 'Live Prices' }}</span>
      </button>

      <button
        class="nav-btn"
        [class.active]="isActive('chatbot')"
        (click)="navigateTo('chatbot')"
        [title]="sidebarCollapsed ? 'Chatbot' : ''">
        <span class="nav-icon">💬</span><span class="nav-label"> Chatbot</span>
      </button>
    </nav>
  </aside>

  <!-- Right Content Area (5/6) -->
  <main class="content-area">
    <!-- Dashboard (Home / Investment Analysis / Chatbot) — kept alive to avoid reload -->
    <app-dashboard [view]="dashboardView" [hidden]="!showDashboard"></app-dashboard>

    <!-- Equity -->
    <app-equity *ngIf="visitedPages.has('equity')" [hidden]="currentPage !== 'equity'"></app-equity>

    <!-- Mutual Funds -->
    <app-mutual-funds *ngIf="visitedPages.has('mutual-funds')" [hidden]="currentPage !== 'mutual-funds'"></app-mutual-funds>

    <!-- Commodity -->
    <app-commodity *ngIf="visitedPages.has('commodity')" [hidden]="currentPage !== 'commodity'"></app-commodity>

    <!-- P2P -->
    <app-p2p *ngIf="visitedPages.has('p2p')" [hidden]="currentPage !== 'p2p'"></app-p2p>

    <!-- Fixed Deposits -->
    <app-fixed-deposits *ngIf="visitedPages.has('fixed-deposits')" [hidden]="currentPage !== 'fixed-deposits'"></app-fixed-deposits>

    <!-- Forex -->
    <app-forex *ngIf="visitedPages.has('forex')" [hidden]="currentPage !== 'forex'"></app-forex>
  </main>
  </div>

  <!-- ===== MOBILE BOTTOM TAB BAR ===== -->
  <nav class="bottom-tab-bar">
    <button class="tab-btn" [class.active]="isActive('home')" (click)="navigateTo('home')">
      <span class="tab-icon">🏠</span><span class="tab-label">Home</span>
    </button>
    <button class="tab-btn" [class.active]="isActive('equity')" (click)="navigateTo('equity')">
      <span class="tab-icon">📈</span><span class="tab-label">Equity</span>
    </button>
    <button class="tab-btn" [class.active]="isActive('mutual-funds')" (click)="navigateTo('mutual-funds')">
      <span class="tab-icon">💼</span><span class="tab-label">MF</span>
    </button>
    <button class="tab-btn" [class.active]="isActive('commodity')" (click)="navigateTo('commodity')">
      <span class="tab-icon">⛏️</span><span class="tab-label">Commodity</span>
    </button>
    <button class="tab-btn" [class.active]="isActive('p2p')" (click)="navigateTo('p2p')">
      <span class="tab-icon">👥</span><span class="tab-label">P2P</span>
    </button>
    <button class="tab-btn" [class.active]="showMoreSheet || isMorePage" (click)="toggleMoreSheet()">
      <span class="tab-icon">☰</span><span class="tab-label">More</span>
    </button>
  </nav>

  <!-- More sheet backdrop -->
  <div class="more-sheet-overlay" [class.open]="showMoreSheet" (click)="closeMoreSheet()"></div>

  <!-- More slide-up sheet -->
  <div class="more-sheet" [class.open]="showMoreSheet">
    <div class="more-sheet-header">
      <span>More</span>
      <button class="more-sheet-close" (click)="closeMoreSheet()">✕</button>
    </div>
    <div class="more-sheet-grid">
      <button class="more-sheet-btn" [class.active]="isActive('fixed-deposits')" (click)="navigateTo('fixed-deposits')">
        <span class="more-sheet-btn-icon">🏦</span><span>Fixed Deposits</span>
      </button>
      <button class="more-sheet-btn" [class.active]="isActive('forex')" (click)="navigateTo('forex')">
        <span class="more-sheet-btn-icon">💱</span><span>Forex</span>
      </button>
      <button class="more-sheet-btn" [class.active]="isActive('investment-analysis')" (click)="navigateTo('investment-analysis')">
        <span class="more-sheet-btn-icon">📊</span><span>Analysis</span>
      </button>
      <button class="more-sheet-btn" [class.active]="isActive('chatbot')" (click)="navigateTo('chatbot')">
        <span class="more-sheet-btn-icon">💬</span><span>Chatbot</span>
      </button>
    </div>
    <div class="more-sheet-divider"></div>
    <div class="more-sheet-utils">
      <button class="more-util-btn" (click)="refreshData(); closeMoreSheet()" [disabled]="isRefreshing">
        <span>{{ isRefreshing ? '⏳' : '🔄' }}</span>
        <span>{{ isRefreshing ? 'Refreshing...' : 'Refresh Data' }}</span>
      </button>
      <button class="more-util-btn" (click)="fetchAllLivePrices(); closeMoreSheet()" [disabled]="isFetchingAllPrices" [title]="livePriceTooltip">
        <span>{{ isFetchingAllPrices ? '⏳' : '📡' }}</span>
        <span>{{ isFetchingAllPrices ? 'Fetching...' : 'Live Prices' }}</span>
      </button>
    </div>
  </div>

  <!-- Floating Action Button (mobile only, pages with add-entry) -->
  <button class="mobile-fab" *ngIf="showAddEntry" (click)="triggerAddEntry()" title="Add Entry">+</button>

</div>
