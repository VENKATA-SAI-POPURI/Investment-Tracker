# Every day at 09:15 IST (03:45 UTC), weekends included (tax and FD dates do not stop on Saturdays), ask the API
# to push each opted-in person up to three "do now" actions they have not been pushed yet. Needs the same two
# repository secrets as the market scan:
#   API_URL    e.g. https://investment-tracker-nrm5.onrender.com
#   JOB_TOKEN  the same value as the JOB_TOKEN environment variable on the API host
name: Daily digest

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Send the digest
        env:
          API_URL: ${{ secrets.API_URL }}
          JOB_TOKEN: ${{ secrets.JOB_TOKEN }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$JOB_TOKEN" ]; then
            echo "API_URL and JOB_TOKEN secrets are not set; nothing to do"; exit 0
          fi
          # A sleeping host can take a minute to wake; retry once before giving up. A retry is safe: an action
          # already pushed is stamped, so a second run sends nothing for it.
          for attempt in 1 2; do
            code=$(curl -s -o out.json -w "%{http_code}" --max-time 240 -X POST \
              -H "X-Job-Token: $JOB_TOKEN" "$API_URL/api/jobs/daily-digest")
            echo "attempt $attempt: HTTP $code"; cat out.json; echo
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
