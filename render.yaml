services:
  - type: web
    name: investment-tracker-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run automatically at start-up (versioned, each runs once). The longer timeout
    # covers the first market-history download for the performance page.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 4
    healthCheckPath: /api/ping
    envVars:
      - key: DATABASE_PATH
        value: /opt/render/project/data/investments.db
    disk:
      name: data
      mountPath: /opt/render/project/data
      sizeGB: 1
